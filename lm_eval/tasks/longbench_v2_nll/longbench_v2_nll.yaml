tag:
  - longcxt_nll
task: longbench_v2_nll
dataset_path: ""
dataset_name: ""
output_type: multiple_choice
test_split: test
custom_dataset: !function utils.get_longbench_v2
doc_to_text: "{{input}}"
doc_to_target: "answer"
doc_to_choice: ["A)", "B)", "C)", "D)"]
gen_prefix: "\nThe correct answer is ("
target_delimiter: ""
process_results: !function utils.process_results
metric_list:
  - metric: "acc"
    aggregation: mean
    higher_is_better: true
  - metric: "acc_short"
    aggregation: !function utils.aggregate_bucket
    higher_is_better: true
  - metric: "acc_medium"
    aggregation: !function utils.aggregate_bucket
    higher_is_better: true
  - metric: "acc_long"
    aggregation: !function utils.aggregate_bucket
    higher_is_better: true
repeats: 1
metadata:
  version: 1.0
